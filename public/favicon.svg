<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Fork: 3 tines -->
  <line x1="9.5"  y1="5.5" x2="9.5"  y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="12"   y1="5.5" x2="12"   y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="14.5" y1="5.5" x2="14.5" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Fork: arch connecting tines into stem -->
  <path d="M9.5 11.5 C9.5 14.5 14.5 14.5 14.5 11.5" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Fork: stem -->
  <line x1="12" y1="14" x2="12" y2="26.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Knife: straight spine -->
  <line x1="21" y1="5.5" x2="21" y2="26.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Knife: blade curve -->
  <path d="M21 5.5 C25 7.5 25.5 11 21 15" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
